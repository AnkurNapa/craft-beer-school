name: Keep Supabase awake

# Supabase free projects pause after about a week with no API traffic, which
# would silently break the application form during a quiet spell. One cheap
# read a day keeps the project active. Free on public repos.
on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret not set, nothing to ping."
            exit 0
          fi
          # HEAD against the table. anon cannot read rows, so this returns 200
          # with no data, which is all we need to count as activity.
          code=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/applications?select=id&limit=1")
          echo "Supabase responded $code"
          case "$code" in
            2*|4*) echo "Project is awake." ;;
            *) echo "Unexpected response, project may be paused."; exit 1 ;;
          esac
